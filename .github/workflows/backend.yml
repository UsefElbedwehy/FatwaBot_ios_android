name: backend
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        # Pinned, not `latest`. A floating version means the toolchain can change
        # under a branch that changed nothing — which is exactly how `deno-version:
        # v2.x` started failing lint on files that predate the rule it enforces.
        # This is the version the migrations are actually developed against.
        with: { version: 2.109.1 }
      # Applies every migration + seed against a disposable local stack.
      - run: supabase db start
        working-directory: backend
      - run: supabase db lint
        working-directory: backend
