name: ios
on:
  push:
    branches: [main]
    paths: ["ios/**", "content/test-fixtures/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "content/test-fixtures/**", ".github/workflows/ios.yml"]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test Swift packages
        working-directory: ios/Modules
        run: |
          for pkg in */Package.swift; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            xcodebuild test \
              -scheme "$dir" \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -workspace "$dir" -skipPackagePluginValidation || exit 1
            echo "::endgroup::"
          done
