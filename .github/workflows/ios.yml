name: ios
on:
  push:
    branches: [main]
    paths: ["ios/**", "content/test-fixtures/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "content/test-fixtures/**", ".github/workflows/ios.yml"]

jobs:
  package-tests:
    runs-on: macos-15
    strategy:
      matrix:
        package: [FatwaBotKit, PrayerKit]
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: ios/Packages/${{ matrix.package }}
        run: swift test

  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/App
        run: xcodegen generate
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild -project FatwaBot.xcodeproj -scheme FatwaBot \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
