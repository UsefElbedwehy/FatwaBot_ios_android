openapi: "3.1.0"
info:
  title: Fatwa Bot Platform API
  version: "1.0.0-m0"
  description: >
    Versioned REST API for the mobile applications (ADR-0002). Milestone 0 surface:
    health + config platform reads (ADR-0011). Clients send x-client-platform,
    x-client-version, x-client-locale headers on every request.
servers:
  - url: https://{project}.supabase.co/functions/v1/api
    variables:
      project:
        default: fatwabot
paths:
  /v1/health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
  /v1/auth/anonymous:
    post:
      summary: Create a zero-signup anonymous identity (ADR-0004)
      operationId: createAnonymousIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "200":
          description: Tokens for the new identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token (single-use)
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair; the presented refresh token is consumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/me:
    get:
      summary: Validate the bearer token and return the caller's identity + profile
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                type: object
                required: [user_id, kind, display_name, provider]
                properties:
                  user_id: { type: string, format: uuid }
                  kind: { type: string, enum: [anonymous, account] }
                  display_name: { type: [string, "null"] }
                  provider: { type: string, enum: [anonymous, apple, google] }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/me/profile:
    patch:
      summary: Set or clear the optional, self-chosen display name (docs/features/accounts.md)
      operationId: updateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: [string, "null"], minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user_id, display_name]
                properties:
                  user_id: { type: string, format: uuid }
                  display_name: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/auth/apple:
    post:
      summary: Sign in (or reuse an existing account) via Apple identity token
      operationId: signInWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSignInRequest" }
      responses:
        "200":
          description: Tokens for the (possibly newly created) account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/auth/google:
    post:
      summary: Sign in (or reuse an existing account) via Google identity token
      operationId: signInWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSignInRequest" }
      responses:
        "200":
          description: Tokens for the (possibly newly created) account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/auth/link:
    post:
      summary: Upgrade the authenticated (typically anonymous) user in place — preserves user_id
      operationId: linkProvider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, identity_token]
              properties:
                provider: { type: string, enum: [apple, google] }
                identity_token: { type: string }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [user_id, provider, linked]
                properties:
                  user_id: { type: string, format: uuid }
                  provider: { type: string, enum: [apple, google] }
                  linked: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /v1/config:
    get:
      summary: Remote config, feature flags, and enabled locales
      operationId: getConfig
      parameters: [ $ref: "#/components/parameters/ClientPlatform" ]
      responses:
        "200":
          description: Aggregated configuration
          content:
            application/json:
              schema:
                type: object
                required: [config, flags, locales]
                properties:
                  config:
                    type: object
                    additionalProperties: true
                  flags:
                    type: object
                    additionalProperties:
                      type: object
                      required: [enabled]
                      properties:
                        enabled: { type: boolean }
                        rollout: { type: object, additionalProperties: true }
                  locales:
                    type: array
                    items: { $ref: "#/components/schemas/LocaleInfo" }
  /v1/config/theme:
    get:
      summary: Published theme tokens (values over a fixed schema)
      operationId: getTheme
      responses:
        "200":
          description: Latest published theme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/config/strings/{locale}:
    get:
      summary: Localized string pack (delta-aware)
      operationId: getStringPack
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string }
        - name: since_version
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Latest pack, or up_to_date marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StringPack"
                  - type: object
                    required: [up_to_date]
                    properties:
                      up_to_date: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/home:
    get:
      summary: Server-composed Home layout (native section catalog, ADR-0011)
      operationId: getHomeLayout
      parameters: [ $ref: "#/components/parameters/ClientPlatform" ]
      responses:
        "200":
          description: Ordered sections; clients skip unknown types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeLayout" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/config/prayer-defaults:
    get:
      summary: Prayer calculation defaults for a country (ADR-0003 policy channel)
      operationId: getPrayerDefaults
      parameters:
        - name: country
          in: query
          schema: { type: string, pattern: "^([A-Za-z]{2}|\\*)$", default: "*" }
      responses:
        "200":
          description: Country defaults with global fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrayerDefaults" }
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/content/azkar:
    get:
      summary: Azkar categories + items, locale-resolved, delta-aware (docs/features/content-pipeline.md)
      operationId: getAzkarCollection
      parameters: [ $ref: "#/components/parameters/SinceVersion" ]
      responses:
        "200":
          description: Full collection or up_to_date marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AzkarCollection"
                  - $ref: "#/components/schemas/UpToDate"
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/content/duas:
    get:
      summary: Dua categories + duas, locale-resolved, delta-aware
      operationId: getDuaCollection
      parameters: [ $ref: "#/components/parameters/SinceVersion" ]
      responses:
        "200":
          description: Full collection or up_to_date marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DuaCollection"
                  - $ref: "#/components/schemas/UpToDate"
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/content/hadith-collections:
    get:
      summary: Hadith collection summaries (no entries — see the per-collection endpoint)
      operationId: getHadithCollections
      responses:
        "200":
          description: List of collection summaries
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items: { $ref: "#/components/schemas/HadithCollectionSummary" }
  /v1/content/hadith-collections/{slug}:
    get:
      summary: Full entries for one hadith collection, delta-aware
      operationId: getHadithCollectionDetail
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/SinceVersion"
      responses:
        "200":
          description: Collection detail or up_to_date marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HadithCollectionDetail"
                  - $ref: "#/components/schemas/UpToDate"
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/content/wird-templates:
    get:
      summary: Guided wird-creation templates, delta-aware
      operationId: getWirdTemplates
      parameters: [ $ref: "#/components/parameters/SinceVersion" ]
      responses:
        "200":
          description: Full template list or up_to_date marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WirdTemplatesCollection"
                  - $ref: "#/components/schemas/UpToDate"
        "400": { $ref: "#/components/responses/ApiError" }
  /v1/gamification/events:
    post:
      summary: Batched, idempotent activity-event ingest (docs/features/gamification.md)
      operationId: submitActivityEvents
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/ActivityEventInput" }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/gamification/profile:
    get:
      summary: Assembled streaks/missions/badges, folded live from the event log + published definitions
      operationId: getGamificationProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: timezone
          in: query
          schema: { type: string, description: "IANA timezone, e.g. Asia/Riyadh; defaults to UTC" }
      responses:
        "200":
          description: Gamification profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GamificationProfile" }
        "401": { $ref: "#/components/responses/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClientPlatform:
      name: x-client-platform
      in: header
      schema: { type: string, enum: [ios, android] }
    SinceVersion:
      name: since_version
      in: query
      schema: { type: integer }
  responses:
    ApiError:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    LocaleInfo:
      type: object
      required: [locale, display_name, direction, digits]
      properties:
        locale: { type: string }
        display_name: { type: string }
        direction: { type: string, enum: [ltr, rtl] }
        digits: { type: string, enum: [western, eastern] }
    Theme:
      type: object
      required: [version, tokens]
      properties:
        version: { type: integer }
        tokens: { type: object, additionalProperties: true }
    StringPack:
      type: object
      required: [locale, version, strings]
      properties:
        locale: { type: string }
        version: { type: integer }
        strings:
          type: object
          additionalProperties: { type: string }
    HomeLayout:
      type: object
      required: [version, sections]
      properties:
        version: { type: integer }
        sections:
          type: array
          items:
            type: object
            required: [id, type, props]
            properties:
              id: { type: string }
              type: { type: string }
              props: { type: object, additionalProperties: true }
    PrayerDefaults:
      type: object
      required: [country_code, method, params]
      properties:
        country_code: { type: string }
        method: { type: string }
        params: { type: object, additionalProperties: true }
    DeviceRegistration:
      type: object
      required: [platform, app_version, locale, timezone]
      properties:
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
        locale: { type: string }
        timezone: { type: string }
    ProviderSignInRequest:
      type: object
      required: [identity_token, device]
      properties:
        identity_token:
          type: string
          description: >
            Provider-issued identity token. Verified via a pluggable
            IdentityProviderVerifier (docs/features/accounts.md) — a dev-mode
            stub today, swappable for real Apple/Google JWKS verification
            once Q8's OAuth credentials are provisioned.
        device: { $ref: "#/components/schemas/DeviceRegistration" }
    TokenResponse:
      type: object
      required: [user_id, kind, access_token, expires_in, refresh_token]
      properties:
        user_id: { type: string, format: uuid }
        kind: { type: string, enum: [anonymous, account] }
        access_token: { type: string }
        expires_in: { type: integer, description: "Access token TTL in seconds" }
        refresh_token: { type: string, description: "Opaque, single-use" }
    UpToDate:
      type: object
      required: [up_to_date]
      properties:
        up_to_date: { type: boolean, enum: [true] }
    AzkarItem:
      type: object
      required: [id, sortOrder, arabicText, source, repeatCount]
      properties:
        id: { type: string, format: uuid }
        sortOrder: { type: integer }
        arabicText: { type: string }
        transliteration: { type: [string, "null"] }
        translation: { type: [string, "null"] }
        virtueNote: { type: [string, "null"] }
        source: { type: string }
        repeatCount: { type: integer }
    AzkarCategory:
      type: object
      required: [id, slug, name, sortOrder, items]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/AzkarItem" }
    AzkarCollection:
      type: object
      required: [version, categories]
      properties:
        version: { type: integer }
        categories:
          type: array
          items: { $ref: "#/components/schemas/AzkarCategory" }
    Dua:
      type: object
      required: [id, sortOrder, title, arabicText, source]
      properties:
        id: { type: string, format: uuid }
        sortOrder: { type: integer }
        title: { type: string }
        arabicText: { type: string }
        transliteration: { type: [string, "null"] }
        translation: { type: [string, "null"] }
        source: { type: string }
    DuaCategory:
      type: object
      required: [id, slug, name, sortOrder, duas]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        duas:
          type: array
          items: { $ref: "#/components/schemas/Dua" }
    DuaCollection:
      type: object
      required: [version, categories]
      properties:
        version: { type: integer }
        categories:
          type: array
          items: { $ref: "#/components/schemas/DuaCategory" }
    HadithCollectionSummary:
      type: object
      required: [id, slug, name, description, entryCount]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        entryCount: { type: integer }
    HadithEntry:
      type: object
      required: [id, number, arabicText, grading, source]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        arabicText: { type: string }
        translation: { type: [string, "null"] }
        grading: { type: string }
        benefitNote: { type: [string, "null"] }
        source: { type: string }
    HadithCollectionDetail:
      type: object
      required: [version, slug, name, description, entries]
      properties:
        version: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/HadithEntry" }
    WirdTemplate:
      type: object
      required: [id, name, description, type, defaultTarget, defaultUnit, defaultFrequency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        defaultTarget: { type: integer }
        defaultUnit: { type: string }
        defaultFrequency: { type: string }
    WirdTemplatesCollection:
      type: object
      required: [version, templates]
      properties:
        version: { type: integer }
        templates:
          type: array
          items: { $ref: "#/components/schemas/WirdTemplate" }
    ActivityEventInput:
      type: object
      required: [client_event_id, event_type, occurred_at, timezone]
      properties:
        client_event_id: { type: string, description: "Client-generated UUID; resubmitting is a no-op" }
        event_type: { type: string }
        occurred_at: { type: string, format: date-time }
        timezone: { type: string, description: "IANA timezone" }
        metadata: { type: object, additionalProperties: true }
    GamificationProfile:
      type: object
      required: [streaks, missions, badges]
      properties:
        streaks:
          type: array
          items:
            type: object
            required: [key, name, current_length, longest_length, grace_remaining]
            properties:
              key: { type: string }
              name: { type: string }
              current_length: { type: integer }
              longest_length: { type: integer }
              grace_remaining: { type: integer }
        missions:
          type: array
          items:
            type: object
            required: [key, name, progress, target, window, ends_at]
            properties:
              key: { type: string }
              name: { type: string }
              progress: { type: integer }
              target: { type: integer }
              window: { type: string, enum: [daily, weekly, lifetime] }
              ends_at: { type: [string, "null"], format: date-time }
        badges:
          type: array
          items:
            type: object
            required: [key, name, icon_ref, earned_at]
            properties:
              key: { type: string }
              name: { type: string }
              icon_ref: { type: string }
              earned_at: { type: [string, "null"], format: date-time }
