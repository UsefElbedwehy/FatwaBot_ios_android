# XcodeGen spec — regenerate with `xcodegen generate` in ios/App.
# The .xcodeproj is NOT committed; this file is the source of truth.
name: FatwaBot
options:
  bundleIdPrefix: com.fatwabot
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  FatwaBotKit:
    path: ../Packages/FatwaBotKit
  PrayerKit:
    path: ../Packages/PrayerKit
  AppFeatures:
    path: ../Packages/AppFeatures
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
targets:
  FatwaBot:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FatwaBotKit
        products: [CoreKit, NetworkingKit, DesignSystemKit, ConfigKit, ContentKit]
      - package: PrayerKit
        products: [PrayerKit]
      - package: AppFeatures
        products: [PrayerFeature, TasbeehFeature, AzkarFeature, DuaFeature, AwradFeature, HadithFeature, GamificationFeature, LeaderboardFeature, SearchHistoryFeature, OnboardingFeature]
      - target: FatwaBotWidgets
      - target: FatwaBotLiveActivity
      - package: GoogleSignIn
        products: [GoogleSignIn]
    # Explicit Info.plist: Google Sign-In needs CFBundleURLTypes (the reversed
    # client id) to receive the OAuth callback, and that has no INFOPLIST_KEY_
    # build-setting equivalent.
    info:
      path: Support/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        NSLocationWhenInUseUsageDescription: "لعرض أوقات الصلاة واتجاه القبلة لموقعك"
        NSSupportsLiveActivities: true
        CFBundleDisplayName: "Fatwa"
        # Declared so iOS shows the per-app Language picker in Settings (arabic-first).
        CFBundleLocalizations: [ar, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Background refresh keeps the prayer schedule's horizon moving without
        # the user opening the app. Without the identifier declared here,
        # BGTaskScheduler.register throws at launch.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.fatwabot.app.prayer-refresh]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.665767164439-gbe98ql9lddnddflkmev7vaira6mako3
          # Widget / Live Activity deep links — keep in sync with CoreKit.DeepLink.scheme
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.fatwabot.app.deeplink
            CFBundleURLSchemes:
              - fatwabot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatwabot.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/FatwaBot.entitlements
      configs:
        # iOS crash reporting goes through TestFlight / Xcode Organizer rather
        # than a third-party SDK (docs/features/analytics-and-crash-reporting.md).
        # That only yields readable stack traces if the archive carries dSYMs, so
        # pin it here instead of relying on the Xcode default staying put.
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  FatwaBotWidgets:
    type: app-extension
    platform: iOS
    sources: [../Widgets/Sources]
    dependencies:
      - package: PrayerKit
        products: [PrayerKit]
      - package: FatwaBotKit
        products: [CoreKit, DesignSystemKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatwabot.app.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../Widgets/Support/Info.plist
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../Widgets/Support/FatwaBotWidgets.entitlements
  FatwaBotLiveActivity:
    type: app-extension
    platform: iOS
    sources: [../LiveActivity/Sources]
    dependencies:
      - package: PrayerKit
        products: [PrayerKit]
      # For CoreKit.DeepLink — so the activity's tap target uses the same
      # canonical route definition as the app and the widgets.
      - package: FatwaBotKit
        products: [CoreKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatwabot.app.liveactivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../LiveActivity/Support/Info.plist
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../LiveActivity/Support/FatwaBotLiveActivity.entitlements
  # UI tests drive the app through the accessibility layer rather than by
  # injecting synthetic taps at the window server. That distinction is the whole
  # reason this target exists: simctl-style tap injection has repeatedly failed
  # to reach this app's windows, which left every screen verified only by
  # "it compiled".
  FatwaBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../UITests/Sources]
    dependencies:
      - target: FatwaBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatwabot.app.uitests
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FatwaBot

schemes:
  FatwaBot:
    build:
      targets:
        FatwaBot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FatwaBotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
