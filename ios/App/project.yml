# XcodeGen spec — regenerate with `xcodegen generate` in ios/App.
# The .xcodeproj is NOT committed; this file is the source of truth.
name: FatwaBot
options:
  bundleIdPrefix: com.fatwabot
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  FatwaBotKit:
    path: ../Packages/FatwaBotKit
targets:
  FatwaBot:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FatwaBotKit
        products: [CoreKit, NetworkingKit, DesignSystemKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatwabot.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fatwa Bot"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
